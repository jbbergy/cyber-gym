# Production sur jibhey.fr : le conteneur rejoint le réseau « infra » du Postgres partagé
# (/srv/postgres) et n'écoute qu'en local ; Caddy publie gym.jibhey.fr en HTTPS.
services:
  app:
    build: .
    image: cyber-gym
    container_name: cyber-gym
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:4320:3000"
    networks:
      - infra

networks:
  infra:
    external: true
